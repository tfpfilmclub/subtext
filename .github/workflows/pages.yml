name: Publish SUBTEXT

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the magazine
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify content and assets
        run: npm run check
      - name: Build the website
        run: npm run build
      - name: Verify article sharing previews
        run: npm run check:social
      - name: Verify Bangla reading editions
        run: npm run check:bangla
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v5
